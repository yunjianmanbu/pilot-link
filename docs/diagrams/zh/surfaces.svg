<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="344" viewBox="0 0 1040 344" role="img" aria-label="一个 App，三件事">
<title>一个 App，三件事</title>
<style>text{font-family:-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;}.mono{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,monospace;}</style>
<rect width="1040" height="344" rx="16" fill="#060a0f"/>
<text x="40" y="40" font-size="17" fill="#e9f4f4" font-weight="600" text-anchor="start">一个 App，三件事</text>
<text x="40" y="62" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">所有页面都通过中继协议读同一份会话模型</text>
<rect x="40" y="96" width="306" height="150" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="62" y="126" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="1.2">会话</text><line x1="62" y1="140" x2="324" y2="140" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="62" y="176" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">列表、搜索、接着跑</text><text x="62" y="198" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">桌面端已经开始的任务</text><rect x="367" y="96" width="306" height="150" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="389" y="126" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="1.2">实时执行</text><line x1="389" y1="140" x2="651" y2="140" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="389" y="176" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">流式输出与工具调用，</text><text x="389" y="198" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">批准、取消、重试</text><rect x="694" y="96" width="306" height="150" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="716" y="126" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="1.2">文件与记忆</text><line x1="716" y1="140" x2="978" y2="140" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="716" y="176" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">预览会话写出的文件，</text><text x="716" y="198" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">知识库与进化记录</text><rect x="40" y="268" width="960" height="56" rx="14" fill="#081018" stroke="rgba(123,240,208,0.32)" stroke-width="1.2"/><text x="60" y="302" font-size="12" fill="#7bf0d0" font-weight="400" text-anchor="start">数据层直接实现中继协议与会话模型，不是套壳的聊天界面。</text>
</svg>
