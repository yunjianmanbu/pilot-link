<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="348" viewBox="0 0 1040 348" role="img" aria-label="配一次，四步，不注册账号">
<title>配一次，四步，不注册账号</title>
<style>text{font-family:-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;}.mono{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,monospace;}</style>
<rect width="1040" height="348" rx="16" fill="#060a0f"/>
<text x="40" y="40" font-size="17" fill="#e9f4f4" font-weight="600" text-anchor="start">配一次，四步，不注册账号</text>
<text x="40" y="62" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">二维码把桌面端已经持有的同一份密钥交给手机</text>
<rect x="40" y="96" width="228" height="152" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><circle cx="74" cy="126" r="13" fill="#081018" stroke="#7bf0d0" stroke-width="1.4"/><text class="mono" x="74" y="131" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="middle">1</text><line x1="94" y1="126" x2="256" y2="126" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="58" y="176" font-size="13" fill="#e9f4f4" font-weight="600" text-anchor="start">扫码</text><text x="58" y="208" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">二维码里带中继地址、</text><text x="58" y="228" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">房间号和配对密钥</text><rect x="284" y="96" width="228" height="152" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><circle cx="318" cy="126" r="13" fill="#081018" stroke="#7bf0d0" stroke-width="1.4"/><text class="mono" x="318" y="131" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="middle">2</text><line x1="338" y1="126" x2="500" y2="126" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="302" y="176" font-size="13" fill="#e9f4f4" font-weight="600" text-anchor="start">准入</text><text x="302" y="208" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">中继校验签名票据、</text><text x="302" y="228" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">有效期与来源</text><rect x="528" y="96" width="228" height="152" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><circle cx="562" cy="126" r="13" fill="#081018" stroke="#7bf0d0" stroke-width="1.4"/><text class="mono" x="562" y="131" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="middle">3</text><line x1="582" y1="126" x2="744" y2="126" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="546" y="176" font-size="13" fill="#e9f4f4" font-weight="600" text-anchor="start">加密</text><text x="546" y="208" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">端到端 AES-256-GCM，</text><text x="546" y="228" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">中继只看到密文</text><rect x="772" y="96" width="228" height="152" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><circle cx="806" cy="126" r="13" fill="#081018" stroke="#7bf0d0" stroke-width="1.4"/><text class="mono" x="806" y="131" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="middle">4</text><text x="790" y="176" font-size="13" fill="#e9f4f4" font-weight="600" text-anchor="start">同步</text><text x="790" y="208" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">会话、实时输出与审批</text><text x="790" y="228" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">共用同一个房间</text><rect x="40" y="272" width="960" height="56" rx="14" fill="#081018" stroke="rgba(123,240,208,0.32)" stroke-width="1.2"/><text x="60" y="306" font-size="12" fill="#7bf0d0" font-weight="400" text-anchor="start">同一局域网可以完全不用中继，两端直连；跨网络就自己部署一台 pilot-connector。</text>
</svg>
